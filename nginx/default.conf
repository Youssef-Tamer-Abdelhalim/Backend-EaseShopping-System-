# تحديد منطقة لتحديد معدل الطلبات (Rate Limiting)
# تسمح بـ 10 طلبات في الثانية لكل عنوان IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    # تحسين الأداء عبر ضغط البيانات (Gzip)
    gzip on;
    gzip_types text/plain application/xml text/css application/javascript;
    gzip_min_length 1000;

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        # توجيه الطلبات إلى حاوية الـ Node.js (بافتراض اسمها في Docker هو 'api')
        proxy_pass http://api:8000;
        
        # تمرير عناوين الـ IP الحقيقية للباك اند
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # إعدادات الـ Timeout لمنع الطلبات المعلقة
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # حماية الملفات الحساسة
    location ~ /\. {
        deny all;
    }
}